<?xml version="1.0" encoding="UTF-8"?>
<!-- Blank keyboard keycap for the HUD button badges. The LABEL is NOT baked in: the badge text is
     composited at runtime from the key actually bound to the N64 button (see
     zelda3d/hud/zelda3d_hud_tex.cpp Zelda3D_KeyCapTex + input/zelda3d_keymap.cpp), so a rebind in
     the input editor changes the HUD immediately. Cap face spans x 5..59, y 4..56 -> centre (32,30);
     the runtime keeps the glyph run inside a 46px-wide inner box. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#F4F4F5"/>
      <stop offset="100%" stop-color="#D8D8DA"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="1.5" dy="2" stdDeviation="1.5" flood-color="#00000055"/>
    </filter>
  </defs>
  <rect x="5" y="4" width="54" height="52" rx="9" ry="9"
        fill="url(#cap)" stroke="#555559" stroke-width="1.5"
        filter="url(#shadow)"/>
  <rect x="7" y="6" width="50" height="6" rx="6" ry="6"
        fill="#FFFFFF" fill-opacity="0.55"/>
</svg>
