<?xml version="1.0" encoding="UTF-8"?>
<!-- Xbox face-button glyph: X (blue). Subtle-depth variant: flat base + a low-opacity top
     sheen and a faint bottom inner shadow. Still no stroke on the letter. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="45%"  stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="29" fill="#2C7FD4"/>
  <circle cx="32" cy="32" r="29" fill="url(#sheen)"/>
  <circle cx="32" cy="32" r="29" fill="none" stroke="#17518F" stroke-width="2" opacity="0.6"/>
  <text x="32" y="32" text-anchor="middle" dominant-baseline="central"
        font-family="Liberation Sans, Nimbus Sans, DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="42" fill="#FFFFFF">X</text>
</svg>
